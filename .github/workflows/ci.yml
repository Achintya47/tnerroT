name: tnerroT CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show GCC Version
        shell: bash
        run: |
          gcc --version

      - name: Build Project
        shell: bash
        run: |
          gcc \
            -Wall -Wextra -Werror \
            -Iinclude \
            utils/sha1.c \
            src/bencoder.c \
            src/btypes.c \
            src/main.c \
            src/torrent.c \
            src/tracker.c \
            src/peer.c \
            src/downloader.c \
            src/piece_manager.c \
            src/file_writer.c \
            src/log.c \
            utils/RFC1738_url_parser.c \
            -lws2_32 \
            -o tnerroT.exe

      # NOTE: no smoke-test run step here anymore. main.c now performs a
      # real tracker announce + peer-wire download, which needs a live
      # swarm/network that CI can't guarantee. We still build tnerroT.exe
      # above so a broken compile/link fails CI, we just don't execute it.

      # BENCODER TESTS
      - name: Build Bencoder Tests
        shell: bash
        run: |
          gcc \
            -Wall -Wextra -Werror \
            -Iinclude \
            -Itests \
            src/bencoder.c \
            src/btypes.c \
            tests/test_bencoder.c \
            -o test_bencoder.exe

      - name: Run Bencoder Tests
        shell: bash
        run: |
          ./test_bencoder.exe

      # TORRENT PARSER TESTS
      - name: Build Torrent Tests
        shell: bash
        run: |
          gcc \
            -Wall -Wextra -Werror \
            -Iinclude \
            -Itests \
            src/bencoder.c \
            src/btypes.c \
            src/torrent.c \
            utils/sha1.c \
            tests/test_torrent.c \
            src/tracker.c \
            utils/RFC1738_url_parser.c \
            -lws2_32 \
            -o test_torrent.exe

      - name: Run Torrent Tests
        shell: bash
        run: |
          ./test_torrent.exe